name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *" # daily ~7am Pacific: refresh event data, then deploy
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh event data (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: |
          python3 scraper/run.py || echo "scrape failed; deploying previous data"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "Refresh event data" || echo "no data changes"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
