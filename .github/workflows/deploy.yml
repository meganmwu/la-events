name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *" # daily ~7am Pacific: refresh event data, then deploy
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer run supersedes an older one. GitHub's Pages template uses `false`
  # here, but that let a run stuck in "waiting" hold this group for 20 days and
  # silently starve every daily scrape queued behind it. Deploys take seconds,
  # so losing one to a newer run costs nothing next to that failure mode.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Generous enough for a scrape that hits Eventbrite's rate-limit backoffs
    # (~25 min worst case), short enough that a hang can't camp on the lock.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh event data (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: |
          python3 scraper/run.py || echo "scrape failed; deploying previous data"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "Refresh event data" || echo "no data changes"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
