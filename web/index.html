<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-Scene</title>
  <meta name="description" content="Discover local shows and performances across Los Angeles." />
  <link rel="stylesheet" href="https://use.typekit.net/fsc4rce.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😝</text></svg>" />
</head>
<body>
  <nav class="experience-bar">
    <div class="experience-tabs" id="experience-tabs" role="tablist" aria-label="Experience">
      <button data-experience="fun" class="active">Just for fun</button>
      <button data-experience="demo">Demo</button>
    </div>
  </nav>

  <div id="experience-fun">
  <header class="site-header">
    <div class="hero-grid" id="hero-grid" aria-hidden="true"></div>
    <div class="wrap header-inner">
      <h1 class="visually-hidden">B-Scene</h1>
      <p class="tagline">Discover local shows and performances.</p>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <section class="controls">
    <div class="wrap">
      <div class="controls-row">
        <div class="view-toggle" id="view-toggle" role="tablist" aria-label="Date range view">
          <button data-view="day">Day</button>
          <button data-view="week" class="active">Week</button>
        </div>
        <div class="pager" id="pager">
          <button id="prev" title="Previous" aria-label="Previous period">‹</button>
          <button id="next" title="Next" aria-label="Next period">›</button>
          <button id="cal-btn" aria-haspopup="dialog" aria-expanded="false">
            <span class="period-label" id="period-label"></span>
            <span class="caret">▾</span>
          </button>
          <button id="today-btn">Today</button>
          <div id="calendar" class="calendar hidden" role="dialog" aria-label="Pick a date"></div>
        </div>
        <input type="search" id="search" placeholder="Search events, artists, venues…" />
      </div>

      <div class="controls-row chips-row" id="category-chips" aria-label="Event type"></div>

      <div class="controls-row filters-row">
        <label class="toggle">
          <input type="checkbox" id="free-only" />
          <span class="toggle-pill"></span> Free events only
        </label>
      </div>

      <div class="controls-row chips-row genre-row hidden" id="genre-chips" aria-label="Music genre"></div>
    </div>
  </section>

  <main class="wrap" id="results" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        Event data belongs to its sources —
        <a href="https://www.eventbrite.com/d/ca--los-angeles/events/" target="_blank" rel="noopener">Eventbrite</a>,
        <a href="https://losangeles.ohmyrockness.com/" target="_blank" rel="noopener">Oh My Rockness</a>,
        <a href="https://cap.ucla.edu/calendar" target="_blank" rel="noopener">CAP UCLA</a>,
        <a href="https://www.losangelesfunevents.com/" target="_blank" rel="noopener">LA Fun Events</a>.
        Always check the linked event page for final details.
      </p>
    </div>
  </footer>
  </div>

  <section id="experience-demo" class="hidden">
    <div class="demo-toolbar">
      <div class="demo-datenav">
        <button id="demo-prev" aria-label="Previous night"></button>
        <button id="demo-next" aria-label="Next night"></button>
        <button class="demo-date-btn" id="demo-date-btn" aria-haspopup="dialog" aria-expanded="false">
          <span class="demo-date-label" id="demo-date-label"></span>
        </button>
        <div class="demo-calendar hidden" id="demo-calendar" role="dialog" aria-label="Pick a date"></div>
      </div>
      <button class="demo-avatar-btn demo-me-btn" id="demo-profile-btn" aria-label="Your profile"></button>
    </div>

    <div class="demo-split">
      <div class="demo-list" id="demo-list"></div>
      <div class="demo-map" id="demo-map">
        <svg id="demo-map-svg" class="demo-map-svg" aria-hidden="true">
          <path class="map-ocean" />
          <g class="map-freeways"></g>
          <g class="map-streets"></g>
          <path class="map-coast" />
          <path class="map-walk" hidden />
          <g class="map-places"></g>
        </svg>
        <div class="demo-pins" id="demo-pins"></div>
        <div class="demo-infobox hidden" id="demo-infobox"></div>
        <div class="demo-map-controls">
          <button class="demo-map-btn" id="demo-zoom-in" aria-label="Zoom in">+</button>
          <button class="demo-map-btn" id="demo-zoom-out" aria-label="Zoom out">−</button>
          <button class="demo-map-btn" id="demo-zoom-fit" aria-label="Fit all shows">⤢</button>
        </div>
      </div>
    </div>
  </section>

  <script src="data/events.js"></script>
  <script src="app.js"></script>
  <script src="data/demo-shows.js"></script>
  <script src="demo.js"></script>
</body>
</html>
